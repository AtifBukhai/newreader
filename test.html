<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitabo Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0a0a0f;
      color: #e4e4f0;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .success { background: rgba(0, 184, 148, 0.2); border: 1px solid #00b894; }
    .error { background: rgba(225, 112, 85, 0.2); border: 1px solid #e17055; }
    .info { background: rgba(108, 92, 231, 0.2); border: 1px solid #6c5ce7; }
  </style>
</head>
<body>
  <h1>Kitabo Application Test</h1>
  <div id="results"></div>

  <script type="module">
    const results = document.getElementById('results');
    
    function addResult(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `test-result ${type}`;
      div.textContent = message;
      results.appendChild(div);
    }

    try {
      addResult('Starting tests...', 'info');
      
      // Test 1: Import service
      addResult('Test 1: Importing service...', 'info');
      const { kitaboService } = await import('./src/services/kitabo.ts');
      addResult('✓ Service imported successfully', 'success');

      // Test 2: Check service state
      addResult('Test 2: Checking service state...', 'info');
      const state = kitaboService.getState();
      addResult(`✓ Service state: ${state ? 'Demo mode' : 'Supabase mode'}`, 'success');

      // Test 3: Get users
      addResult('Test 3: Getting users...', 'info');
      const users = kitaboService.getUsers();
      addResult(`✓ Found ${users.length} users`, 'success');

      // Test 4: Test login
      addResult('Test 4: Testing login...', 'info');
      const loginResult = await kitaboService.signIn('admin@kitabo.io', 'test');
      if (loginResult.success) {
        addResult(`✓ Login successful: ${loginResult.data?.name}`, 'success');
      } else {
        addResult(`✗ Login failed: ${loginResult.error}`, 'error');
      }

      // Test 5: Get current user
      addResult('Test 5: Getting current user...', 'info');
      const currentUser = await kitaboService.getCurrentUser();
      if (currentUser) {
        addResult(`✓ Current user: ${currentUser.name} (${currentUser.role})`, 'success');
      } else {
        addResult('⚠ No current user', 'info');
      }

      addResult('All tests completed!', 'success');
    } catch (error) {
      addResult(`✗ Test failed: ${error.message}`, 'error');
      console.error('Test error:', error);
    }
  </script>
</body>
</html>
